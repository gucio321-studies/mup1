name: Deply

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - name: CHeck out code
        uses: actions/checkout@v7
      - name: "Install UV"
        uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: "docs/"
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Build PDF
        working-directory: docs/
        run: |
          uv run quarto render
